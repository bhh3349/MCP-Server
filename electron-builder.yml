# MCP-Server Electron 打包配置（替代 Tauri，不依赖系统 WebView2）。
#
# 布局：
#   src-electron/main.cjs + preload.cjs   # 主进程（随包发布，不打包）
#   src-tauri/sidecar/sidecar.cjs         # 后端单文件（npm run build:sidecar 生成）
#   src-tauri/sidecar/ui/                 # 控制中心静态文件
#   src-tauri/sidecar/extensions/         # 插件 / 技能 / 连接器
#   src-tauri/node-bin/node.exe           # portable node（Windows，仓库已有）
#
# 打包后 resources/：
#   resources/sidecar/...  resources/node-bin/...
# 与 main.cjs 的 resolveSidecar()/resolveNode() 对应。
appId: com.mcpserver.app
productName: MCP-Server
copyright: Copyright © 2026 bhh3349

directories:
  output: release-electron

files:
  - src-electron/main.cjs
  - src-electron/preload.cjs
  - package.json

extraResources:
  - from: src-tauri/sidecar
    to: sidecar
  - from: src-tauri/node-bin
    to: node-bin

win:
  target:
    - target: nsis
      arch: [x64]
  icon: src-tauri/icons/icon.ico
  artifactName: MCP-Server_${version}_x64-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  displayLanguageSelector: false
  installerLanguages:
    - zh_CN
    - en_US
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: src-tauri/icons/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development
