[package]
name = "mcp-server"
version = "0.1.0"
description = "MCP-Server 桌面控制中心"
authors = ["bhh3349"]
edition = "2021"

# 构建产物见 tauri.conf.json；`npm run tauri:build` 前先 `npm run build` 生成 dist/

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
