<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车 🐦🚲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(180deg, #6ec6f5 0%, #a8e0fa 45%, #fdf6d8 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    color: #1a3a5c;
    letter-spacing: .1em;
    margin-bottom: .4rem;
    text-shadow: 0 3px 0 rgba(255,255,255,.7);
    animation: titleBob 2.4s ease-in-out infinite;
  }
  h1 .emoji { display: inline-block; animation: spin 3s linear infinite; }
  @keyframes titleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .subtitle {
    color: #3a6a94; font-size: clamp(.9rem, 2.5vw, 1.2rem);
    margin-bottom: 1.5rem; letter-spacing: .35em;
  }
  .scene {
    position: relative;
    width: min(92vw, 760px);
    aspect-ratio: 16 / 9;
    background: linear-gradient(180deg, rgba(255,255,255,.25) 0%, rgba(255,255,255,0) 40%);
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(26,58,92,.18), inset 0 2px 0 rgba(255,255,255,.6);
    overflow: hidden;
  }
  .sun {
    position: absolute; top: 8%; right: 10%;
    width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8d6, #ffd93b 70%);
    box-shadow: 0 0 60px 18px rgba(255,217,59,.55);
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .cloud {
    position: absolute; background: #fff; border-radius: 999px; opacity: .92;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud.c1 { top: 12%; width: 110px; height: 34px; animation-duration: 26s; }
  .cloud.c1::before { width: 48px; height: 48px; top: -22px; left: 18px; }
  .cloud.c1::after { width: 34px; height: 34px; top: -14px; left: 58px; }
  .cloud.c2 { top: 26%; width: 80px; height: 26px; animation-duration: 38s; animation-delay: -12s; opacity: .75; }
  .cloud.c2::before { width: 36px; height: 36px; top: -16px; left: 12px; }
  .cloud.c2::after { width: 26px; height: 26px; top: -10px; left: 42px; }
  .cloud.c3 { top: 6%; width: 140px; height: 40px; animation-duration: 52s; animation-delay: -30s; opacity: .6; }
  .cloud.c3::before { width: 60px; height: 60px; top: -28px; left: 24px; }
  .cloud.c3::after { width: 42px; height: 42px; top: -18px; left: 74px; }
  @keyframes drift { from { left: -180px; } to { left: 110%; } }
  .bird {
    position: absolute; top: 18%; font-size: 22px;
    animation: fly linear infinite;
  }
  .bird.b1 { animation-duration: 20s; }
  .bird.b2 { animation-duration: 30s; animation-delay: -9s; top: 30%; font-size: 16px; }
  @keyframes fly {
    from { left: -40px; transform: translateY(0); }
    25% { transform: translateY(-14px); }
    50% { transform: translateY(0); }
    75% { transform: translateY(-10px); }
    to { left: 105%; transform: translateY(0); }
  }
  svg.rider { position: absolute; bottom: 16%; left: 50%; transform: translateX(-50%); width: 62%; height: auto; overflow: visible; }
  .ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 16%;
    background: linear-gradient(180deg, #8b9aa8 0%, #6e7f8f 100%);
  }
  .ground::before {
    content: ""; position: absolute; top: 42%; left: 0; right: 0; height: 6px;
    background: repeating-linear-gradient(90deg, #fff 0 46px, transparent 46px 92px);
    animation: roadMove .55s linear infinite;
  }
  @keyframes roadMove { to { background-position-x: -92px; } }
  .grass {
    position: absolute; bottom: 16%; left: 0; right: 0; height: 10px;
    background: #7cc46a;
  }
  .wheel { transform-origin: center; transform-box: fill-box; animation: wheelSpin .8s linear infinite; }
  @keyframes wheelSpin { to { transform: rotate(360deg); } }
  .pelican-body { animation: bodyBob .8s ease-in-out infinite; }
  @keyframes bodyBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .wing { transform-origin: 20% 20%; transform-box: fill-box; animation: flap .8s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
  .leg { transform-origin: 50% 8%; transform-box: fill-box; }
  .leg.l1 { animation: pedal .8s linear infinite; }
  .leg.l2 { animation: pedal .8s linear infinite; animation-delay: -.4s; }
  @keyframes pedal { to { transform: rotate(360deg); } }
  .pouch { animation: pouchWobble .8s ease-in-out infinite; transform-origin: 80% 20%; transform-box: fill-box; }
  @keyframes pouchWobble { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
  .speedline {
    position: absolute; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.85);
    animation: speed linear infinite;
  }
  .speedline.s1 { top: 52%; width: 70px; animation-duration: .9s; }
  .speedline.s2 { top: 60%; width: 46px; animation-duration: .7s; animation-delay: -.3s; }
  .speedline.s3 { top: 68%; width: 90px; animation-duration: 1.1s; animation-delay: -.6s; }
  @keyframes speed { from { left: 8%; opacity: 0; } 20% { opacity: 1; } to { left: -12%; opacity: 0; } }
  .caption {
    margin-top: 1.4rem; color: #1a3a5c; font-size: 1rem; letter-spacing: .2em;
    background: rgba(255,255,255,.55); padding: .6rem 1.6rem; border-radius: 999px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(26,58,92,.12);
  }
  .caption b { color: #e8762d; }
</style>
</head>
<body>
  <h1><span class="emoji">🚲</span> 鹈鹕骑车 <span class="emoji">🐦</span></h1>
  <div class="subtitle">PELICAN&nbsp;CYCLING&nbsp;CLUB</div>

  <div class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="bird b1">🕊️</div>
    <div class="bird b2">🕊️</div>
    <div class="speedline s1"></div>
    <div class="speedline s2"></div>
    <div class="speedline s3"></div>

    <svg class="rider" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" aria-label="一只鹈鹕骑着自行车">
      <!-- 后轮 -->
      <g class="wheel">
        <circle cx="170" cy="300" r="72" fill="none" stroke="#2b3a4a" stroke-width="10"/>
        <circle cx="170" cy="300" r="60" fill="none" stroke="#c8d4de" stroke-width="3"/>
        <g stroke="#9fb0bf" stroke-width="3">
          <line x1="170" y1="300" x2="170" y2="240"/><line x1="170" y1="300" x2="170" y2="360"/>
          <line x1="170" y1="300" x2="110" y2="300"/><line x1="170" y1="300" x2="230" y2="300"/>
          <line x1="170" y1="300" x2="128" y2="258"/><line x1="170" y1="300" x2="212" y2="342"/>
          <line x1="170" y1="300" x2="212" y2="258"/><line x1="170" y1="300" x2="128" y2="342"/>
        </g>
        <circle cx="170" cy="300" r="10" fill="#e8762d"/>
      </g>
      <!-- 前轮 -->
      <g class="wheel">
        <circle cx="470" cy="300" r="72" fill="none" stroke="#2b3a4a" stroke-width="10"/>
        <circle cx="470" cy="300" r="60" fill="none" stroke="#c8d4de" stroke-width="3"/>
        <g stroke="#9fb0bf" stroke-width="3">
          <line x1="470" y1="300" x2="470" y2="240"/><line x1="470" y1="300" x2="470" y2="360"/>
          <line x1="470" y1="300" x2="410" y2="300"/><line x1="470" y1="300" x2="530" y2="300"/>
          <line x1="470" y1="300" x2="428" y2="258"/><line x1="470" y1="300" x2="512" y2="342"/>
          <line x1="470" y1="300" x2="512" y2="258"/><line x1="470" y1="300" x2="428" y2="342"/>
        </g>
        <circle cx="470" cy="300" r="10" fill="#e8762d"/>
      </g>
      <!-- 车架 -->
      <g stroke="#e8762d" stroke-width="12" stroke-linecap="round" fill="none">
        <line x1="170" y1="300" x2="300" y2="200"/>
        <line x1="300" y1="200" x2="430" y2="200"/>
        <line x1="430" y1="200" x2="470" y2="300"/>
        <line x1="300" y1="200" x2="340" y2="300"/>
        <line x1="340" y1="300" x2="470" y2="300"/>
        <line x1="430" y1="200" x2="452" y2="150"/>
      </g>
      <!-- 车座 & 车把 -->
      <line x1="285" y1="188" x2="315" y2="188" stroke="#2b3a4a" stroke-width="14" stroke-linecap="round"/>
      <line x1="452" y1="150" x2="470" y2="150" stroke="#2b3a4a" stroke-width="12" stroke-linecap="round"/>
      <!-- 脚踏 -->
      <circle cx="340" cy="300" r="14" fill="none" stroke="#2b3a4a" stroke-width="6"/>
      <line x1="340" y1="300" x2="340" y2="330" stroke="#2b3a4a" stroke-width="6" stroke-linecap="round"/>
      <line x1="325" y1="330" x2="355" y2="330" stroke="#2b3a4a" stroke-width="8" stroke-linecap="round"/>

      <!-- 鹈鹕 -->
      <g class="pelican-body">
        <!-- 腿 -->
        <g class="leg l1" stroke="#f2a03d" stroke-width="9" stroke-linecap="round">
          <line x1="330" y1="205" x2="330" y2="245"/>
          <line x1="330" y1="245" x2="345" y2="245"/>
        </g>
        <g class="leg l2" stroke="#e08a2d" stroke-width="9" stroke-linecap="round">
          <line x1="352" y1="205" x2="352" y2="245"/>
          <line x1="352" y1="245" x2="337" y2="245"/>
        </g>
        <!-- 身体 -->
        <ellipse cx="330" cy="165" rx="72" ry="52" fill="#fdfdfd" stroke="#d9e2ea" stroke-width="3"/>
        <!-- 翅膀 -->
        <path class="wing" d="M300 150 Q250 130 225 165 Q250 185 305 175 Z" fill="#eef3f7" stroke="#d9e2ea" stroke-width="3"/>
        <!-- 尾巴 -->
        <path d="M262 155 L228 140 L236 168 Z" fill="#eef3f7" stroke="#d9e2ea" stroke-width="3"/>
        <!-- 脖子 & 头 -->
        <path d="M385 140 Q400 100 395 70" fill="none" stroke="#fdfdfd" stroke-width="30" stroke-linecap="round"/>
        <circle cx="395" cy="58" r="30" fill="#fdfdfd" stroke="#d9e2ea" stroke-width="3"/>
        <!-- 眼睛 -->
        <circle cx="404" cy="50" r="7" fill="#1a2b3c"/>
        <circle cx="406.5" cy="47.5" r="2.4" fill="#fff"/>
        <!-- 大嘴 + 喉囊 -->
        <path d="M408 62 L510 78 L408 88 Z" fill="#f2a03d" stroke="#d97f1e" stroke-width="3" stroke-linejoin="round"/>
        <path class="pouch" d="M412 66 Q460 108 505 80 Q470 96 412 74 Z" fill="#f7c873" stroke="#d97f1e" stroke-width="2.5"/>
        <!-- 嘴里的鱼 -->
        <g transform="translate(468 74) rotate(-12)">
          <ellipse cx="0" cy="0" rx="20" ry="9" fill="#7fc8e8" stroke="#4a9ec4" stroke-width="2"/>
          <path d="M-20 0 L-32 -9 L-32 9 Z" fill="#7fc8e8" stroke="#4a9ec4" stroke-width="2"/>
          <circle cx="10" cy="-2" r="2.4" fill="#123"/>
        </g>
        <!-- 翅膀扶着车把 -->
        <path d="M360 140 Q410 150 448 152" fill="none" stroke="#eef3f7" stroke-width="20" stroke-linecap="round"/>
      </g>
    </svg>

    <div class="grass"></div>
    <div class="ground"></div>
  </div>

  <div class="caption">今日配送：新鲜小鱼 <b>× 1</b> 🐟 准时送达</div>
</body>
</html>
