<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP-Server 控制中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo-row">
      <div class="logo"><span class="logo-icon">▦</span><span class="logo-text">MCP-Server</span></div>
      <button id="collapse-btn" title="收起侧边栏">«</button>
    </div>
    <div class="logo-ver"><span class="logo-text">v0.1.0</span></div>
    <nav id="nav">
      <button class="nav-item active" data-page="overview"><span class="nav-ico">⊞</span><span class="nav-text">概览</span></button>
      <button class="nav-item" data-page="channels"><span class="nav-ico">◉</span><span class="nav-text">信道</span><span class="nav-badge" id="badge-channels"></span></button>
      <button class="nav-item" data-page="gateway"><span class="nav-ico">⌁</span><span class="nav-text">网关</span></button>
      <button class="nav-item" data-page="extensions"><span class="nav-ico">✚</span><span class="nav-text">扩展</span><span class="nav-badge" id="badge-ext"></span></button>
      <button class="nav-item" data-page="tools"><span class="nav-ico">⚒</span><span class="nav-text">工具</span><span class="nav-badge" id="badge-tools"></span></button>
      <button class="nav-item" data-page="logs"><span class="nav-ico">☰</span><span class="nav-text">日志</span></button>
      <button class="nav-item" data-page="errors"><span class="nav-ico">⚠</span><span class="nav-text">错误</span><span class="nav-badge red" id="badge-errors"></span></button>
    </nav>
    <div class="side-foot">
      <div class="srv-card"><span class="dot green pulse"></span><div class="srv-text"><div class="srv-title">服务器运行中</div><div class="srv-sub mono" id="uptime">--</div></div></div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="crumb" id="crumb">概览</div>
      <div class="top-right">
        <span class="live-pill"><span class="dot green pulse"></span>LIVE</span>
        <button id="cmdk-btn" class="cmdk-btn"><span>搜索</span><kbd>⌘K</kbd></button>
      </div>
    </header>
    <div id="pages">
      <section class="page active" id="page-overview"></section>
      <section class="page" id="page-channels"></section>
      <section class="page" id="page-gateway"></section>
      <section class="page" id="page-extensions"></section>
      <section class="page" id="page-tools"></section>
      <section class="page" id="page-logs"></section>
      <section class="page" id="page-errors"></section>
    </div>
  </main>
</div>

<div id="cmdk-overlay" class="hidden">
  <div class="cmdk-box">
    <input id="cmdk-input" placeholder="搜索工具、信道…" autocomplete="off">
    <div id="cmdk-list"></div>
  </div>
</div>

<div id="modal-overlay" class="hidden"><div id="modal-box"></div></div>
<div id="toast-wrap"></div>

<script src="app.js"></script>
</body>
</html>
